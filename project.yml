name: Viernes
# Genera Viernes.xcodeproj con XcodeGen (macOS):  brew install xcodegen && xcodegen generate
# Requiere Xcode 26 o superior (mlx-swift-lm usa swift-tools-version 6.2). Ver INSTALL.md.
options:
  bundleIdPrefix: com.example          # CÁMBIALO por el tuyo (Signing & Capabilities)
  developmentLanguage: es
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"                # modo Swift 5: comprobaciones de concurrencia mínimas (ver ARCHITECTURE.md)
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"         # solo iPhone
    DEVELOPMENT_TEAM: ""                # <-- pon tu Team ID
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  ViernesCore:
    path: .
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    minorVersion: 3.32.3
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0

targets:
  Viernes:
    type: application
    platform: iOS
    sources:
      - path: App/Viernes
    dependencies:
      - package: ViernesCore
        product: ViernesCore
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
    entitlements:
      path: App/Viernes/Viernes.entitlements
      properties:
        # Más memoria para modelos de 1–2 GB. Si tu cuenta no lo permite, elimínalo (ver LOCAL_MODELS.md).
        com.apple.developer.kernel.increased-memory-limit: true
    info:
      path: App/Viernes/Info.plist
      properties:
        CFBundleDisplayName: Viernes
        CFBundleDevelopmentRegion: es
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        # NO se declara UIBackgroundModes: Viernes no escucha ni procesa audio en segundo plano (ver VOICE.md).
        NSMicrophoneUsageDescription: >-
          Viernes usa el micrófono solo mientras tú la activas (botón, palabra «Viernes» con la app abierta o Siri) para convertir tu voz en texto. El audio se procesa en el dispositivo y no se guarda.
        NSSpeechRecognitionUsageDescription: >-
          Viernes usa el reconocimiento de voz de Apple, preferentemente en el dispositivo, para transcribir lo que le dices.
        NSRemindersFullAccessUsageDescription: >-
          Para crear, listar y completar recordatorios cuando tú se lo pidas y confirmes.
        NSCalendarsWriteOnlyAccessUsageDescription: >-
          Para crear eventos en tu calendario cuando tú se lo pidas y confirmes. Por defecto Viernes no lee tus eventos.
        NSCalendarsFullAccessUsageDescription: >-
          Solo si activas «Permitir que Viernes lea mi calendario» en Privacidad: para leer tus eventos cuando se lo pidas y confirmes, por ejemplo «¿qué tengo mañana?».
        NSContactsUsageDescription: >-
          Solo si activas «Permitir que Viernes lea mis contactos» en Privacidad: para buscar el correo o el teléfono de una persona cuando se lo pidas y confirmes.
        NSFaceIDUsageDescription: >-
          Para proteger la pantalla de Memoria con Face ID si activas esa opción.
        NSCameraUsageDescription: >-
          Solo cuando tú eliges «Tomar una foto» o «Escanear documento» al adjuntar algo a un mensaje. La foto o el escaneo se leen en el teléfono y solo salen de él si lo autorizas al enviarlos a un cerebro en la nube.
        CFBundleURLTypes:
          - CFBundleURLName: com.example.viernes.link
            CFBundleURLSchemes:
              - viernes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.viernes
        PRODUCT_NAME: Viernes
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  ViernesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/ViernesTests
    dependencies:
      - target: Viernes
      - package: ViernesCore
        product: ViernesCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.viernes.tests

  ViernesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/ViernesUITests
    dependencies:
      - target: Viernes
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.viernes.uitests

schemes:
  Viernes:
    build:
      targets:
        Viernes: all
    run:
      config: Debug
    test:
      config: Debug
      environmentVariables:
        VIERNES_KEYCHAIN_SERVICE: com.example.viernes.tests     # aísla la clave de cifrado de las pruebas
      targets:
        - ViernesTests
        - ViernesUITests
