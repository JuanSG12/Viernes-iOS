name: IPA sin firmar

# Genera Viernes.ipa SIN firmar para instalarlo en un iPhone con Sideloadly / AltStore (Apple ID gratuito).
# iOS no instala apps sin firmar: Sideloadly la firma en tu PC con tu Apple ID. No se guardan claves ni certificados aquí.
# Se lanza a mano: Actions > "IPA sin firmar" > Run workflow. El .ipa queda como artefacto de la ejecución.
on:
  # También se dispara al cambiar el archivo-señal (lanzable con un commit, sin abrir GitHub).
  push:
    paths:
      - 'qa/ipa.trigger'
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner de macOS (macos-26 = arm64; macos-26-intel si arm64 está saturado)"
        default: macos-26
        type: choice
        options: [macos-26, macos-26-intel]

permissions:
  contents: read

jobs:
  ipa:
    name: Compilar .ipa
    runs-on: ${{ inputs.runner || 'macos-26-intel' }}
    permissions:
      contents: write          # solo para publicar el texto de los errores en la rama ci-errors-ipa si algo falla
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto
        run: xcodegen generate

      # Sin firma: el entitlement increased-memory-limit y el Team no existen para una cuenta gratuita;
      # Sideloadly firma después con el Apple ID del usuario.
      - name: Compilar para iPhone (Release, sin firma)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Viernes.xcodeproj -scheme Viernes \
            -configuration Release -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -skipMacroValidation -skipPackagePluginValidation \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM= 2>&1 | tee build-ipa.log

      # El registro solo se ve con sesión de GitHub: los errores también van al resumen de la ejecución (público).
      - name: Resumen de errores (si falló)
        if: failure()
        run: |
          echo "### Errores de compilación (IPA)" >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:|fatal error|Could not|cannot find|No such" build-ipa.log 2>/dev/null | sort -u | head -40 | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true
          echo "### Últimas líneas del registro" >> "$GITHUB_STEP_SUMMARY"
          tail -30 build-ipa.log 2>/dev/null | cut -c1-300 | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true

      # Mismo texto de errores, en una rama pública (ci-errors-ipa) para leerlo sin sesión de GitHub.
      - name: Publicar errores en la rama ci-errors-ipa (si falló)
        if: failure()
        run: |
          mkdir -p /tmp/ci-errors
          OUT=/tmp/ci-errors/errores.txt
          echo "IPA  commit: ${GITHUB_SHA}" > "$OUT"
          echo "=== errores de compilación" >> "$OUT"
          grep -hE "error:|fatal error|Could not|cannot find|No such" build-ipa.log 2>/dev/null | cut -c1-400 | sort -u | head -60 >> "$OUT" || true
          echo "=== últimas líneas" >> "$OUT"
          tail -40 build-ipa.log 2>/dev/null | cut -c1-300 >> "$OUT" || true
          cd /tmp/ci-errors
          git init -q
          git checkout -q -b ci-errors-ipa
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Errores del IPA para ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-errors-ipa

      - name: Empaquetar Viernes.ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "Viernes.app" | head -1)
          test -n "$APP" || { echo "No se encontró Viernes.app"; exit 1; }
          rm -rf Payload Viernes.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Viernes.ipa Payload
          ls -lh Viernes.ipa
          # Comprobación básica de que es un binario de iPhone (arm64)
          lipo -info "$APP/Viernes" || true

      - uses: actions/upload-artifact@v4
        with:
          name: Viernes-ipa-sin-firmar
          path: Viernes.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipa-build-log
          path: build-ipa.log
          if-no-files-found: ignore
