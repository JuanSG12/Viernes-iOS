name: Capturas del simulador

# Compila la app para el simulador, la lanza en varios estados visuales y publica las capturas en la rama `ci-screenshots`
# (y como artefacto) para REVISAR el diseño sin tener un Mac. Es una ayuda de verificación visual: las capturas salen de un
# simulador, no de un iPhone real (el rendimiento y el brillo no son representativos). Los estados se fijan con argumentos de
# lanzamiento que SOLO existen con --uitest; el uso real nunca los lee.
on:
  # Se dispara también al cambiar el archivo-señal (así se puede lanzar con un simple commit, sin abrir GitHub).
  push:
    paths:
      - 'qa/shots.trigger'
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner de macOS (macos-26 = arm64; macos-26-intel si arm64 está saturado)"
        default: macos-26
        type: choice
        options: [macos-26, macos-26-intel]

permissions:
  contents: write

jobs:
  shots:
    name: Capturas
    runs-on: ${{ inputs.runner || 'macos-26' }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto
        run: xcodegen generate

      - name: Elegir y arrancar simulador
        id: sim
        run: |
          LIST=$(xcrun simctl list devices available)
          UDID=$(echo "$LIST" | grep -E "iPhone 1[6-9]( Pro| Plus| Pro Max)? \(" | grep -i "pro max" | head -1 | grep -oE "[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}" || true)
          if [ -z "$UDID" ]; then UDID=$(echo "$LIST" | grep -E "iPhone 1[6-9]( Pro| Plus| Pro Max)? \(" | head -1 | grep -oE "[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}" || true); fi
          if [ -z "$UDID" ]; then UDID=$(echo "$LIST" | grep -E "iPhone .* \(" | head -1 | grep -oE "[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}"); fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Simulador: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true

      - name: Compilar para el simulador (firma ad-hoc)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Viernes.xcodeproj -scheme Viernes \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -skipMacroValidation -skipPackagePluginValidation \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM= 2>&1 | tee build-shots.log

      - name: Instalar y fotografiar
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          APP=$(find build/Build/Products -maxdepth 2 -name "Viernes.app" | head -1)
          test -n "$APP" || { echo "No se encontró Viernes.app"; exit 1; }
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          export SIMCTL_CHILD_VIERNES_KEYCHAIN_SERVICE=com.example.viernes.shots
          shoot() {
            name="$1"; shift
            xcrun simctl launch --terminate-running-process "$UDID" com.example.viernes --uitest --uitest-skip-onboarding "$@" || true
            sleep 9
            xcrun simctl io "$UDID" screenshot "shots/$name.png" || true
          }
          shoot home-idle --uitest-3d --uitest-core-state=idle
          shoot home-listening --uitest-3d --uitest-core-state=listening
          shoot home-thinking --uitest-3d --uitest-core-state=thinking
          shoot home-executing --uitest-3d --uitest-core-state=executing
          shoot home-error --uitest-3d --uitest-core-state=error
          shoot home-thinking-nobloom --uitest-3d --uitest-core-state=thinking --uitest-no-bloom
          shoot home-executing-nobloom --uitest-3d --uitest-core-state=executing --uitest-no-bloom
          shoot home-thinking-bare --uitest-3d --uitest-core-state=thinking --uitest-no-effects
          shoot home-executing-bare --uitest-3d --uitest-core-state=executing --uitest-no-effects
          shoot home-fallback-2d --uitest-core-state=idle
          shoot conversation-weather --uitest-3d --uitest-demo-weather
          ls -la shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: shots
          if-no-files-found: ignore

      - name: Publicar en la rama ci-screenshots
        if: always()
        run: |
          set -e
          test -d shots && ls shots/*.png >/dev/null 2>&1 || { echo "No hay capturas"; exit 1; }
          cp -R shots /tmp/shots-publish
          cd /tmp/shots-publish
          git init -q
          git checkout -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Capturas del commit ${GITHUB_SHA} (simulador, no iPhone real)" > README.txt
          git add -A
          git commit -q -m "Capturas del simulador para ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-screenshots
