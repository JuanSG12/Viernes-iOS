name: CI

# Compila y prueba Viernes en runners de macOS de GitHub (el desarrollo se hizo en Windows y nunca se ha compilado la app).
# Jobs:
#   static   – comprobaciones estáticas (Linux, rápido)
#   core     – `swift test` del paquete ViernesCore (la lógica; sin simulador)
#   app      – XcodeGen + build + pruebas unitarias y de UI en simulador de iOS.
#              Se ejecuta en DOS variantes para separar causas de fallo:
#                full   = con MLX (mlx-swift-lm); el riesgo conocido es MLXEngine.swift
#                no-mlx = sin MLX (solo Apple Intelligence); si esta pasa y `full` falla, el problema está en MLXEngine.swift
# Los logs y los .xcresult se guardan como artefactos aunque falle.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner de macOS (macos-26 = arm64; macos-26-intel si arm64 está saturado)"
        default: macos-26
        type: choice
        options: [macos-26, macos-26-intel]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # En main nunca se cancela una ejecución a medias (los runners de macOS tardan y se perdían los resultados).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static:
    name: Comprobaciones estáticas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Autoprueba del verificador y verificación
        shell: pwsh
        run: |
          ./scripts/test-static-check.ps1
          ./scripts/static-check.ps1

  core:
    name: Core (swift test)
    runs-on: ${{ inputs.runner || 'macos-26' }}
    steps:
      - uses: actions/checkout@v4
      - name: Versiones
        run: |
          xcodebuild -version
          swift --version
      - name: Pruebas del core
        run: swift test 2>&1 | tee core-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-log
          path: core-test.log

  app:
    name: App iOS (${{ matrix.variant }})
    runs-on: ${{ inputs.runner || 'macos-26' }}
    needs: core
    permissions:
      contents: write          # solo para publicar el texto de los errores en la rama ci-errors-<variante> si algo falla
    strategy:
      fail-fast: false
      matrix:
        variant: [no-mlx, full]
    steps:
      - uses: actions/checkout@v4

      - name: Versiones
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Quitar MLX (variante no-mlx)
        if: matrix.variant == 'no-mlx'
        run: |
          bash scripts/strip-mlx.sh project.yml > project.nomlx.yml
          mv project.nomlx.yml project.yml
          grep -c "MLX" project.yml || true

      - name: Caché de paquetes de Swift
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ matrix.variant }}-${{ hashFiles('project.yml') }}

      - name: Generar proyecto
        run: xcodegen generate

      - name: Elegir simulador de iPhone
        id: sim
        run: |
          # Prefiere un iPhone moderno; si no, el primero disponible. Se usa el UDID (inequívoco).
          LIST=$(xcrun simctl list devices available)
          UDID=$(echo "$LIST" | grep -E "iPhone 1[6-9]( Pro| Plus| Pro Max)? \(" | head -1 | grep -oE "[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}" || true)
          if [ -z "$UDID" ]; then UDID=$(echo "$LIST" | grep -E "iPhone .* \(" | head -1 | grep -oE "[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}"); fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Simulador: $UDID"
          xcrun simctl boot "$UDID" || true

      # Firma ad-hoc ("-"): sin firma el Keychain del simulador falla con el error -34018 (falta el entitlement
      # application-identifier) y las pruebas de cifrado/persistencia no pueden correr.
      - name: Compilar (firma ad-hoc)
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Viernes.xcodeproj -scheme Viernes \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -skipMacroValidation -skipPackagePluginValidation \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM= 2>&1 | tee build-${{ matrix.variant }}.log

      - name: Pruebas unitarias y de UI
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Viernes.xcodeproj -scheme Viernes \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -resultBundlePath TestResults-${{ matrix.variant }}.xcresult \
            2>&1 | tee test-${{ matrix.variant }}.log

      - name: Resumen de errores (si falló)
        if: failure()
        run: |
          echo "### Errores de compilación (${{ matrix.variant }})" >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:" build-${{ matrix.variant }}.log | sort -u | head -40 | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true
          echo "### Pruebas fallidas (${{ matrix.variant }})" >> "$GITHUB_STEP_SUMMARY"
          grep -E "Test Case .* failed|error:" test-${{ matrix.variant }}.log 2>/dev/null | sort -u | head -40 | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true

      # Los registros del CI solo se ven con sesión de GitHub. Si algo falla, los errores se publican en una rama pública
      # (ci-errors-<variante>) para poder leerlos sin sesión. Solo texto de errores del compilador y de las pruebas.
      - name: Publicar errores en la rama ci-errors (si falló)
        if: failure()
        run: |
          mkdir -p /tmp/ci-errors
          OUT=/tmp/ci-errors/errores.txt
          echo "variante: ${{ matrix.variant }}  commit: ${GITHUB_SHA}" > "$OUT"
          echo "=== errores de compilación" >> "$OUT"
          grep -hE "error:|fatal error|Could not|cannot find|No such" build-${{ matrix.variant }}.log 2>/dev/null | cut -c1-400 | sort -u | head -60 >> "$OUT" || true
          echo "=== pruebas fallidas" >> "$OUT"
          grep -hE "Test Case .* failed|error:" test-${{ matrix.variant }}.log 2>/dev/null | cut -c1-400 | sort -u | head -60 >> "$OUT" || true
          echo "=== últimas líneas de la compilación" >> "$OUT"
          tail -40 build-${{ matrix.variant }}.log 2>/dev/null | cut -c1-300 >> "$OUT" || true
          cd /tmp/ci-errors
          git init -q
          git checkout -q -b ci-errors-${{ matrix.variant }}
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Errores del CI para ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-errors-${{ matrix.variant }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-${{ matrix.variant }}-logs
          path: |
            build-${{ matrix.variant }}.log
            test-${{ matrix.variant }}.log
            TestResults-${{ matrix.variant }}.xcresult
          if-no-files-found: ignore
